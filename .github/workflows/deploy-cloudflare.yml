name: Deploy to Cloudflare Workers

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build OpenNext Cloudflare Worker
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://iihprcuhmilmymlbktpy.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_xYIoiJIgepiCQDa2d4tOjw_5voIT82e' }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID || 'G-0P6ECEDSWG' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.dmf-talents.de' }}
          NEXT_PUBLIC_DEBUG_MODE: ${{ vars.NEXT_PUBLIC_DEBUG_MODE || 'false' }}
          NEXT_PUBLIC_SENTRY_ENABLE_REPLAY: ${{ vars.NEXT_PUBLIC_SENTRY_ENABLE_REPLAY || 'false' }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || '0x4AAAAAAGJ1Ao5DQXrcFM7U' }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || 'dmf-ys' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'dmf-germany' }}
        run: npm run cf:build
      - name: Deploy Worker & Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cd2355b1655a8bf991ab9faaa0d14d5f
        run: npx opennextjs-cloudflare deploy
