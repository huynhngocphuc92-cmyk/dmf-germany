    <text x="16" y="194" fill="#334155" font-size="11">• 1:1 Bewerbungsgespräch-Coaching auf Deutsch</text>
    <text x="16" y="212" fill="#334155" font-size="11">• Praktische Vorschulung (Gastronomie &amp; Pflege)</text>
