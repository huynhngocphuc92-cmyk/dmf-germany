    <text x="14" y="42" fill="#0F172A" font-size="12" font-weight="700">in Deutschland</text>
    <text x="190" y="34" fill="#15803D" font-size="12" font-weight="700">&gt; 200.000 (seit Jahrzehnten)</text>
