<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="720" height="540" rx="16" fill="#F8FAFC"/>
  <rect x="20" y="20" width="680" height="500" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="20" y="20" width="680" height="76" rx="12" fill="#003366"/>
  <text x="44" y="52" fill="#FFFFFF" font-size="17" font-weight="700">Auszubildende (§ 16a) vs. Anerkannte Fachkraft (§ 18a AufenthG)</text>
  <text x="44" y="76" fill="#CBD5E1" font-size="12">Strategische Personalplanung nach Betriebsgröße, Zeithorizont und Einarbeitungskapazität</text>

  <g transform="translate(44, 116)">
    <rect width="304" height="320" rx="10" fill="#F8FAFC" stroke="#003366" stroke-width="2"/>
    <rect width="304" height="40" rx="10" fill="#003366"/>
    <text x="16" y="25" fill="#FFFFFF" font-size="12" font-weight="700">Duale Berufsausbildung (§ 16a AufenthG)</text>
    <text x="16" y="68" fill="#334155" font-size="11">• Ideal für nachhaltigen Nachwuchsaufbau über 2,5 bis 3,5 Jahre</text>
    <text x="16" y="104" fill="#334155" font-size="11">• Keine langwierige BQFG-Gleichwertigkeitsprüfung erforderlich</text>
    <text x="16" y="140" fill="#334155" font-size="11">• Ausbildung exakt nach eigenen betrieblichen Abläufen und Kammernormen</text>
    <text x="16" y="176" fill="#334155" font-size="11">• Staatliche Förderung über AsA flex (§ 75 SGB III) nutzbar</text>
  </g>

  <g transform="translate(372, 116)">
    <rect width="304" height="320" rx="10" fill="#FFF7ED" stroke="#FF6600" stroke-width="2"/>
    <rect width="304" height="40" rx="10" fill="#FF6600"/>
    <text x="16" y="25" fill="#FFFFFF" font-size="12" font-weight="700">Anerkannte Fachkraft (§ 18a / § 16d AufenthG)</text>
    <text x="16" y="68" fill="#334155" font-size="11">• Ideal bei akutem Fachkräftebedarf in Schicht, Werkstatt oder Baustelle</text>
    <text x="16" y="104" fill="#334155" font-size="11">• Mehrjährige Berufspraxis und abgeschlossenes Fachkolleg / Studium</text>
    <text x="16" y="140" fill="#334155" font-size="11">• Produktiver Wertbeitrag bereits in den ersten Monaten</text>
    <text x="16" y="176" fill="#334155" font-size="11">• Amortisation der Rekrutierungskosten durchschnittlich nach 3–5 Monaten</text>
  </g>

  <rect x="44" y="456" width="632" height="42" rx="8" fill="#003366"/>
  <text x="360" y="482" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Kombinationsempfehlung: Kurzfristige Entlastung über § 18a/§ 16d + langfristige Sicherung über § 16a</text>
</svg>
