<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="fairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="800" height="420" fill="#f8fafc" rx="16" />

  <!-- Header -->
  <rect x="30" y="24" width="740" height="54" rx="10" fill="url(#fairGrad)" />
  <text x="50" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#ffffff">RAL Gütezeichen: 4 Kernsäulen der fairen Fachkräfteanwerbung</text>

  <!-- Pillar 1: Employer Pays -->
  <g transform="translate(30, 96)">
    <rect width="170" height="280" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="170" height="8" rx="4" fill="#0891b2" />
    <circle cx="32" cy="38" r="16" fill="#e0f2fe" />
    <text x="32" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">§</text>
    <text x="56" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e3a5f">Employer-Pays</text>
    
    <text x="16" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0891b2">KOSTENFREIHEIT</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Null Vermittlungsgebühr</text>
    <text x="16" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  für Pflegekräfte</text>
    <text x="16" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Übernahme Sprachkurs</text>
    <text x="16" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Übernahme Flug &amp; Visa</text>
    <text x="16" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Keine Knebelverträge</text>
    <text x="16" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Gesetz nach § 296a SGB III</text>
    
    <rect x="14" y="230" width="142" height="34" rx="6" fill="#e0f2fe" />
    <text x="85" y="251" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0369a1" text-anchor="middle">100 % Audit-geprüft</text>
  </g>

  <!-- Pillar 2: Transparente Verträge -->
  <g transform="translate(220, 96)">
    <rect width="170" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="170" height="8" rx="4" fill="#1e3a5f" />
    <circle cx="32" cy="38" r="16" fill="#f1f5f9" />
    <text x="32" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e3a5f" text-anchor="middle">📄</text>
    <text x="56" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e3a5f">Transparenz</text>
    
    <text x="16" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1e3a5f">ZWEISPRACHIGKEIT</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Zweisprachige Verträge</text>
    <text x="16" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  (Deutsch &amp; Vietnamesisch)</text>
    <text x="16" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Klare Tarifvergütung</text>
    <text x="16" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Erläuterung Schichtdienst</text>
    <text x="16" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Vollständige Aufklärung</text>
    <text x="16" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Keine versteckten Klauseln</text>
    
    <rect x="14" y="230" width="142" height="34" rx="6" fill="#f1f5f9" />
    <text x="85" y="251" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">Rechtssicher B2B</text>
  </g>

  <!-- Pillar 3: Nachhaltige Qualifikation -->
  <g transform="translate(410, 96)">
    <rect width="170" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="170" height="8" rx="4" fill="#0891b2" />
    <circle cx="32" cy="38" r="16" fill="#e0f2fe" />
    <text x="32" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0891b2" text-anchor="middle">🎓</text>
    <text x="56" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e3a5f">Qualifikation</text>
    
    <text x="16" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0891b2">SPRACHE &amp; PRAXIS</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Goethe/telc B2 Pflege</text>
    <text x="16" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Klinische Fachbegriffe</text>
    <text x="16" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Defizitausgleich BQFG</text>
    <text x="16" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Vorbereitung Kenntnis-</text>
    <text x="16" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  prüfung an Pflegeschulen</text>
    <text x="16" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Praxissimulation Vietnam</text>
    
    <rect x="14" y="230" width="142" height="34" rx="6" fill="#f1f5f9" />
    <text x="85" y="251" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">Ausbildungsvorlauf</text>
  </g>

  <!-- Pillar 4: Willkommenskultur & Onboarding -->
  <g transform="translate(600, 96)">
    <rect width="170" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="170" height="8" rx="4" fill="#059669" />
    <circle cx="32" cy="38" r="16" fill="#d1fae5" />
    <text x="32" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">🤝</text>
    <text x="56" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e3a5f">Integration</text>
    
    <text x="16" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#059669">BEGLEITUNG IN DE</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Feste Patenschaft Station</text>
    <text x="16" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Gesicherte Unterkunft</text>
    <text x="16" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Behördenbegleitung</text>
    <text x="16" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Ansprechpartner vor Ort</text>
    <text x="16" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Sozialkulturelle Events</text>
    <text x="16" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Langfristige Bindung</text>
    
    <rect x="14" y="230" width="142" height="34" rx="6" fill="#d1fae5" />
    <text x="85" y="251" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">Nachhaltig im Team</text>
  </g>
</svg>
