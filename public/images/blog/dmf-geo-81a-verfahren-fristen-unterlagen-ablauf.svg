<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="720" height="540" rx="16" fill="#F8FAFC"/>
  <rect x="20" y="20" width="680" height="500" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="20" y="20" width="680" height="76" rx="12" fill="#003366"/>
  <text x="44" y="52" fill="#FFFFFF" font-size="17" font-weight="700">Beschleunigtes Fachkräfteverfahren (§ 81a AufenthG)</text>
  <text x="44" y="76" fill="#CBD5E1" font-size="12">Gesetzliche Behördenfristen und Dokumenten-Checkliste für Personalabteilungen</text>

  <g transform="translate(44, 116)">
    <rect width="304" height="320" rx="10" fill="#F8FAFC" stroke="#003366" stroke-width="2"/>
    <rect width="304" height="40" rx="10" fill="#003366"/>
    <text x="16" y="25" fill="#FFFFFF" font-size="12" font-weight="700">Gesetzliche Regelfristen nach § 81a AufenthG</text>
    <text x="16" y="68" fill="#334155" font-size="11">• Schritt 1: Vereinbarung mit der Ausländerbehörde (Vollmacht)</text>
    <text x="16" y="104" fill="#334155" font-size="11">• Schritt 2: Gleichwertigkeitsprüfung max. 2 Monate (IHK FOSA / HWK)</text>
    <text x="16" y="140" fill="#334155" font-size="11">• Schritt 3: ZAV-Vorabzustimmung innerhalb von 1 Woche (§ 36 BeschV)</text>
    <text x="16" y="176" fill="#334155" font-size="11">• Schritt 4: Botschaftstermin in 3 Wochen + Entscheidung in 3 Wochen</text>
  </g>

  <g transform="translate(372, 116)">
    <rect width="304" height="320" rx="10" fill="#FFF7ED" stroke="#FF6600" stroke-width="2"/>
    <rect width="304" height="40" rx="10" fill="#FF6600"/>
    <text x="16" y="25" fill="#FFFFFF" font-size="12" font-weight="700">Pflichtunterlagen des Arbeitgebers</text>
    <text x="16" y="68" fill="#334155" font-size="11">• Konkretes Arbeitsplatzangebot / Ausbildungsvertrag (IHK/HWK)</text>
    <text x="16" y="104" fill="#334155" font-size="11">• Erklärung zum Beschäftigungsverhältnis (EzB)</text>
    <text x="16" y="140" fill="#334155" font-size="11">• Unterzeichnete Vollmacht & Untervollmacht für DMF Talents</text>
    <text x="16" y="176" fill="#334155" font-size="11">• Verwaltungsgebühr nach § 47 Abs. 1 Nr. 15 AufenthV (411 EUR)</text>
  </g>

  <rect x="44" y="456" width="632" height="42" rx="8" fill="#003366"/>
  <text x="360" y="482" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Zeitvorteil für Arbeitgeber: Verbindliche Fristenkette verkürzt die Gesamtdauer auf ca. 3 bis 6 Monate</text>
</svg>
