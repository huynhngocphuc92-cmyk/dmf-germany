<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="720" height="540" rx="16" fill="#F8FAFC"/>
  <rect x="20" y="20" width="680" height="500" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="20" y="20" width="680" height="76" rx="12" fill="#003366"/>
  <text x="44" y="52" fill="#FFFFFF" font-size="17" font-weight="700">Vollkosten- & ROI-Analyse: Zeitarbeit vs. Direktrekrutierung</text>
  <text x="44" y="76" fill="#CBD5E1" font-size="12">Betriebswirtschaftlicher 36-Monats-Vergleich für Geschäftsführer und kaufmännische Leiter</text>

  <g transform="translate(44, 116)">
    <rect width="304" height="320" rx="10" fill="#F8FAFC" stroke="#003366" stroke-width="2"/>
    <rect width="304" height="40" rx="10" fill="#003366"/>
    <text x="16" y="25" fill="#FFFFFF" font-size="12" font-weight="700">Zeitarbeit / Arbeitnehmerüberlassung (AÜG)</text>
    <text x="16" y="68" fill="#334155" font-size="11">• Laufender Verrechnungssatz-Aufschlag von 60 % bis 100 % auf den Bruttolohn</text>
    <text x="16" y="104" fill="#334155" font-size="11">• Hohe Fluktuation und wiederholter Einarbeitungsaufwand im Team</text>
    <text x="16" y="140" fill="#334155" font-size="11">• Höchstüberlassungsdauer begrenzt auf 18 Monate (§ 1 Abs. 1b AÜG)</text>
    <text x="16" y="176" fill="#334155" font-size="11">• Kein nachhaltiger Kompetenzaufbau im eigenen Stammpersonal</text>
  </g>

  <g transform="translate(372, 116)">
    <rect width="304" height="320" rx="10" fill="#FFF7ED" stroke="#FF6600" stroke-width="2"/>
    <rect width="304" height="40" rx="10" fill="#FF6600"/>
    <text x="16" y="25" fill="#FFFFFF" font-size="12" font-weight="700">Direktrekrutierung über DMF Talents (§ 18a / § 16a)</text>
    <text x="16" y="68" fill="#334155" font-size="11">• Einmalige, transparente Vermittlungs- und Integrationsinvestition</text>
    <text x="16" y="104" fill="#334155" font-size="11">• Reguläres Tarif- bzw. Betriebsgehalt ohne laufende Agenturaufschläge</text>
    <text x="16" y="140" fill="#334155" font-size="11">• Break-Even (Amortisation) durchschnittlich nach 3 bis 5 Monaten</text>
    <text x="16" y="176" fill="#334155" font-size="11">• Über 90 % Verbleibquote schafft stabile Schicht- und Projektplanung</text>
  </g>

  <rect x="44" y="456" width="632" height="42" rx="8" fill="#003366"/>
  <text x="360" y="482" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Interaktives Planungstool: Berechnen Sie Ihren individuellen Break-Even unter dmf-talents.de/roi-rechner</text>
</svg>
