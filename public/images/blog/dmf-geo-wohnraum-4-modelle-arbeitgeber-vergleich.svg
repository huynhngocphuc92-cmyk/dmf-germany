<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="720" height="540" rx="16" fill="#F8FAFC"/>
  <rect x="20" y="20" width="680" height="500" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="20" y="20" width="680" height="76" rx="12" fill="#003366"/>
  <text x="44" y="52" fill="#FFFFFF" font-size="17" font-weight="700">Wohnraum-Organisation für internationale Fachkräfte & Azubis</text>
  <text x="44" y="76" fill="#CBD5E1" font-size="12">Die 4 bewährten Unterkunftsmodelle für mittelständische Betriebe im Praxisvergleich</text>

  <g transform="translate(44, 116)">
    <rect width="304" height="320" rx="10" fill="#F8FAFC" stroke="#003366" stroke-width="2"/>
    <rect width="304" height="40" rx="10" fill="#003366"/>
    <text x="16" y="25" fill="#FFFFFF" font-size="12" font-weight="700">Modell 1 & 2: Betriebliche Azubi-WG & Werkswohnung</text>
    <text x="16" y="68" fill="#334155" font-size="11">• Modell 1 (Azubi-WG): Angemietete 2- bis 4-Zimmer-Wohnung in Betriebsnähe</text>
    <text x="16" y="104" fill="#334155" font-size="11">• Geringe Einzelmiete durch geteilte Nebenkosten und gegenseitige Stütze</text>
    <text x="16" y="140" fill="#334155" font-size="11">• Modell 2 (Werks-/Personalzimmer): Ideal für Hotels, Kliniken & Bäckereien</text>
    <text x="16" y="176" fill="#334155" font-size="11">• Verrechnung im Rahmen der amtlichen Sachbezugswerte möglich</text>
  </g>

  <g transform="translate(372, 116)">
    <rect width="304" height="320" rx="10" fill="#FFF7ED" stroke="#FF6600" stroke-width="2"/>
    <rect width="304" height="40" rx="10" fill="#FF6600"/>
    <text x="16" y="25" fill="#FFFFFF" font-size="12" font-weight="700">Modell 3 & 4: Wohnungsbau-Kooperation & Übergangs-Boardinghouse</text>
    <text x="16" y="68" fill="#334155" font-size="11">• Modell 3: Rahmenvereinbarung mit kommunalen Wohnungsbaugesellschaften</text>
    <text x="16" y="104" fill="#334155" font-size="11">• Modell 4: Möbliertes Apartment für die ersten 3 Monate nach Ankunft</text>
    <text x="16" y="140" fill="#334155" font-size="11">• Wichtig: Wohnungsgeberbestätigung nach § 19 BMG für das Bürgeramt</text>
    <text x="16" y="176" fill="#334155" font-size="11">• Gute ÖPNV-Anbindung an Betrieb und Berufsschule sicherstellen</text>
  </g>

  <rect x="44" y="456" width="632" height="42" rx="8" fill="#003366"/>
  <text x="360" y="482" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Erfahrungswert: Ein bezugsfertiges Zimmer am Ankunftstag ist der wichtigste Grundstein für das Onboarding</text>
</svg>
