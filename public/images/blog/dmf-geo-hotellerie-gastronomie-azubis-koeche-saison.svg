<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="720" height="540" rx="16" fill="#F8FAFC"/>
  <rect x="20" y="20" width="680" height="500" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="20" y="20" width="680" height="76" rx="12" fill="#003366"/>
  <text x="44" y="52" fill="#FFFFFF" font-size="17" font-weight="700">Hotellerie & Gastronomie: 3 Rekrutierungsmodelle im Vergleich</text>
  <text x="44" y="76" fill="#CBD5E1" font-size="12">Rechtssichere Personalplanung für Hotels, Restaurants und Systemgastronomie</text>

  <g transform="translate(44, 116)">
    <rect width="304" height="320" rx="10" fill="#F8FAFC" stroke="#003366" stroke-width="2"/>
    <rect width="304" height="40" rx="10" fill="#003366"/>
    <text x="16" y="25" fill="#FFFFFF" font-size="12" font-weight="700">Langfristige Säulen: § 16a Ausbildung & § 18a Fachkräfte</text>
    <text x="16" y="68" fill="#334155" font-size="11">• Duale Ausbildung (§ 16a): Hotelfach, Restaurantfach, Koch (3 Jahre)</text>
    <text x="16" y="104" fill="#334155" font-size="11">• Ausgebildete Köche & Servicefachkräfte (§ 18a AufenthG)</text>
    <text x="16" y="140" fill="#334155" font-size="11">• Praktische Vorschulung in Lehrküche & Service-Simulation (BCIS)</text>
    <text x="16" y="176" fill="#334155" font-size="11">• Sprachniveau B1/B2 für sicheren Gästekontakt und Kassensystem</text>
  </g>

  <g transform="translate(372, 116)">
    <rect width="304" height="320" rx="10" fill="#FFF7ED" stroke="#FF6600" stroke-width="2"/>
    <rect width="304" height="40" rx="10" fill="#FF6600"/>
    <text x="16" y="25" fill="#FFFFFF" font-size="12" font-weight="700">Saisonale Verstärkung & Schichtstabilität</text>
    <text x="16" y="68" fill="#334155" font-size="11">• Unterstützungskräfte für Hochsaison in Küche, Housekeeping & Bankett</text>
    <text x="16" y="104" fill="#334155" font-size="11">• Hohe Belastbarkeit an Wochenenden, Feiertagen und im Teildienst</text>
    <text x="16" y="140" fill="#334155" font-size="11">• Schulung in Lebensmittelhygiene (HACCP) und Allergenkennzeichnung</text>
    <text x="16" y="176" fill="#334155" font-size="11">• Planbare Vorlaufzeiten durch gebündelte Kohorten-Vorbereitung</text>
  </g>

  <rect x="44" y="456" width="632" height="42" rx="8" fill="#003366"/>
  <text x="360" y="482" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Empfehlung: Kombination aus erfahrenen Küchenfachkräften (§ 18a) und eigenen Nachwuchs-Azubis (§ 16a)</text>
</svg>
