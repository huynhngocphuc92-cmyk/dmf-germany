<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="720" height="540" rx="16" fill="#F8FAFC"/>
  <rect x="20" y="20" width="680" height="500" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="20" y="20" width="680" height="76" rx="12" fill="#003366"/>
  <text x="44" y="52" fill="#FFFFFF" font-size="17" font-weight="700">Staatliche Förderinstrumente für Ausbildungs- & Fachkräftebetriebe</text>
  <text x="44" y="76" fill="#CBD5E1" font-size="12">Öffentliche Unterstützungsangebote von Bundesagentur für Arbeit und BAMF gezielt nutzen</text>

  <g transform="translate(44, 116)">
    <rect width="304" height="320" rx="10" fill="#F8FAFC" stroke="#003366" stroke-width="2"/>
    <rect width="304" height="40" rx="10" fill="#003366"/>
    <text x="16" y="25" fill="#FFFFFF" font-size="12" font-weight="700">Ausbildungsbegleitung: AsA flex (§ 75 SGB III)</text>
    <text x="16" y="68" fill="#334155" font-size="11">• 100 % kostenfrei für Ausbildungsbetrieb und Auszubildende</text>
    <text x="16" y="104" fill="#334155" font-size="11">• Stützunterricht in Fachtheorie, Fachrechnen und Wirtschaftskunde</text>
    <text x="16" y="140" fill="#334155" font-size="11">• Sozialpädagogische Begleitung und Prüfungsvorbereitung (IHK/HWK)</text>
    <text x="16" y="176" fill="#334155" font-size="11">• Antragstellung direkt über den Arbeitgeberservice der Arbeitsagentur</text>
  </g>

  <g transform="translate(372, 116)">
    <rect width="304" height="320" rx="10" fill="#FFF7ED" stroke="#FF6600" stroke-width="2"/>
    <rect width="304" height="40" rx="10" fill="#FF6600"/>
    <text x="16" y="25" fill="#FFFFFF" font-size="12" font-weight="700">Sprach- & Anerkennungsförderung im Betrieb</text>
    <text x="16" y="68" fill="#334155" font-size="11">• BAMF-Berufssprachkurse (DeuFöV nach § 45a AufenthG, B2/C1)</text>
    <text x="16" y="104" fill="#334155" font-size="11">• Qualifizierungschancengesetz (§ 82 SGB III) für Weiterbildung</text>
    <text x="16" y="140" fill="#334155" font-size="11">• Anerkennungszuschuss für Gebühren und Übersetzungen (falls förderfähig)</text>
    <text x="16" y="176" fill="#334155" font-size="11">• Entlastung der Ausbilder im laufenden Tagesgeschäft</text>
  </g>

  <rect x="44" y="456" width="632" height="42" rx="8" fill="#003366"/>
  <text x="360" y="482" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Praxistipp: Förderanträge bereits 4 bis 6 Wochen vor Ausbildungs- oder Arbeitsbeginn vorbereiten</text>
</svg>
