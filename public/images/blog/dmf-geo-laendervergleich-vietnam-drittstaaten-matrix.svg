<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="720" height="540" rx="16" fill="#F8FAFC"/>
  <rect x="20" y="20" width="680" height="500" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="20" y="20" width="680" height="76" rx="12" fill="#003366"/>
  <text x="44" y="52" fill="#FFFFFF" font-size="17" font-weight="700">Internationale Personalgewinnung: Sachlicher Ländervergleich</text>
  <text x="44" y="76" fill="#CBD5E1" font-size="12">Entscheidungskriterien für deutsche Mittelständler, Kliniken und Handwerksbetriebe</text>

  <g transform="translate(44, 116)">
    <rect width="304" height="320" rx="10" fill="#F8FAFC" stroke="#003366" stroke-width="2"/>
    <rect width="304" height="40" rx="10" fill="#003366"/>
    <text x="16" y="25" fill="#FFFFFF" font-size="12" font-weight="700">Strukturelle Stärken des Standorts Vietnam</text>
    <text x="16" y="68" fill="#334155" font-size="11">• Hohe Bildungs- und MINT-Affinität im schulischen Curriculum</text>
    <text x="16" y="104" fill="#334155" font-size="11">• Ausgeprägte Lern- und Arbeitsdisziplin im 5-Tage-Intensivkurs</text>
    <text x="16" y="140" fill="#334155" font-size="11">• Starke praktische Vorbildung in Pflege, Handwerk, Metall & HoGa</text>
    <text x="16" y="176" fill="#334155" font-size="11">• Etablierte Verwaltungswege (APS, Botschaft Hanoi, Generalkonsulat HCMC)</text>
  </g>

  <g transform="translate(372, 116)">
    <rect width="304" height="320" rx="10" fill="#FFF7ED" stroke="#FF6600" stroke-width="2"/>
    <rect width="304" height="40" rx="10" fill="#FF6600"/>
    <text x="16" y="25" fill="#FFFFFF" font-size="12" font-weight="700">Erfolgsfaktoren für nachhaltige Integration</text>
    <text x="16" y="68" fill="#334155" font-size="11">• Stationäre Sprachausbildung (A1 bis B1/B2) vor Ausreise</text>
    <text x="16" y="104" fill="#334155" font-size="11">• 1:1 Interview-Coaching durch deutsche Muttersprachler</text>
    <text x="16" y="140" fill="#334155" font-size="11">• Strukturierte 30- bis 90-Tage-Onboarding-Begleitung vor Ort</text>
    <text x="16" y="176" fill="#334155" font-size="11">• Nachweislich über 90 % Verbleibquote im Ausbildungs- & Arbeitsverhältnis</text>
  </g>

  <rect x="44" y="456" width="632" height="42" rx="8" fill="#003366"/>
  <text x="360" y="482" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Qualitätsprinzip: Individuelle Eignungsprüfung und strukturierte Vorbereitung statt pauschaler Versprechen</text>
