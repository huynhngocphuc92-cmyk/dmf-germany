<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="720" height="540" rx="16" fill="#F8FAFC"/>
  <rect x="20" y="20" width="680" height="500" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="20" y="20" width="680" height="76" rx="12" fill="#003366"/>
  <text x="44" y="52" fill="#FFFFFF" font-size="17" font-weight="700">§ 16d Anerkennungspartnerschaft vs. § 18a AufenthG</text>
  <text x="44" y="76" fill="#CBD5E1" font-size="12">Vergleich von Vorlaufzeit, Sprachniveau und betrieblichem Einsatz für deutsche Arbeitgeber</text>

  <g transform="translate(44, 116)">
    <rect width="304" height="320" rx="10" fill="#F8FAFC" stroke="#003366" stroke-width="2"/>
    <rect width="304" height="40" rx="10" fill="#003366"/>
    <text x="16" y="25" fill="#FFFFFF" font-size="12" font-weight="700">Pfad A: § 16d Abs. 3 AufenthG (Anerkennungspartnerschaft)</text>
    <text x="16" y="68" fill="#334155" font-size="11">• Einreise bereits vor abgeschlossener Gleichwertigkeit möglich</text>
    <text x="16" y="104" fill="#334155" font-size="11">• Sprachvoraussetzung zum Start: mind. A2/B1 (GER)</text>
    <text x="16" y="140" fill="#334155" font-size="11">• Sofortige tarifgebundene Beschäftigung während Nachqualifizierung</text>
    <text x="16" y="176" fill="#334155" font-size="11">• Ziel: Vollanerkennung innerhalb von bis zu 36 Monaten</text>
  </g>

  <g transform="translate(372, 116)">
    <rect width="304" height="320" rx="10" fill="#FFF7ED" stroke="#FF6600" stroke-width="2"/>
    <rect width="304" height="40" rx="10" fill="#FF6600"/>
    <text x="16" y="25" fill="#FFFFFF" font-size="12" font-weight="700">Pfad B: § 18a AufenthG (Vollanerkennung vor Einreise)</text>
    <text x="16" y="68" fill="#334155" font-size="11">• Abgeschlossene BQFG-Gleichwertigkeitsprüfung vor Visumerteilung</text>
    <text x="16" y="104" fill="#334155" font-size="11">• Sprachvoraussetzung: B1/B2 je nach reglementiertem Beruf</text>
    <text x="16" y="140" fill="#334155" font-size="11">• Direkter Einsatz als vollwertige Fachkraft ab Tag 1</text>
    <text x="16" y="176" fill="#334155" font-size="11">• Ideal für sofortige Fachkraft-Verantwortung ohne Auflagen</text>
  </g>

  <rect x="44" y="456" width="632" height="42" rx="8" fill="#003366"/>
  <text x="360" y="482" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Entscheidungsregel: Schneller Personalaufbau vor Ort (§ 16d) vs. sofortige Vollbefugnis ab Einreise (§ 18a)</text>
</svg>
