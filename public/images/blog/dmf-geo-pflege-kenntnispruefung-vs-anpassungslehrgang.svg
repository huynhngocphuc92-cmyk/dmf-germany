<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="720" height="540" rx="16" fill="#F8FAFC"/>
  <rect x="20" y="20" width="680" height="500" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="20" y="20" width="680" height="76" rx="12" fill="#003366"/>
  <text x="44" y="52" fill="#FFFFFF" font-size="17" font-weight="700">Pflegefachkräfte (§ 16d / PflBG): Kenntnisprüfung vs. Anpassungslehrgang</text>
  <text x="44" y="76" fill="#CBD5E1" font-size="12">Entscheidungshilfe für Pflegedienstleitungen in Kliniken, Seniorenheimen und Pflegediensten</text>

  <g transform="translate(44, 116)">
    <rect width="304" height="320" rx="10" fill="#F8FAFC" stroke="#003366" stroke-width="2"/>
    <rect width="304" height="40" rx="10" fill="#003366"/>
    <text x="16" y="25" fill="#FFFFFF" font-size="12" font-weight="700">Option 1: Kenntnisprüfung nach PflBG</text>
    <text x="16" y="68" fill="#334155" font-size="11">• Mündlicher und praktischer Prüfungsteil am Patienten / Simulator</text>
    <text x="16" y="104" fill="#334155" font-size="11">• Fokus auf festgestellte Unterschiede aus dem Defizitbescheid</text>
    <text x="16" y="140" fill="#334155" font-size="11">• Kürzere Gesamtdauer bei hoher fachlicher und sprachlicher Reife</text>
    <text x="16" y="176" fill="#334155" font-size="11">• Gezielter Vorbereitungskurs parallel zum Einsatz als Pflegehelfer</text>
  </g>

  <g transform="translate(372, 116)">
    <rect width="304" height="320" rx="10" fill="#FFF7ED" stroke="#FF6600" stroke-width="2"/>
    <rect width="304" height="40" rx="10" fill="#FF6600"/>
    <text x="16" y="25" fill="#FFFFFF" font-size="12" font-weight="700">Option 2: Anpassungslehrgang nach PflBG</text>
    <text x="16" y="68" fill="#334155" font-size="11">• Strukturierter Theorie- und Praxisunterricht mit Abschlussgespräch</text>
    <text x="16" y="104" fill="#334155" font-size="11">• Hohe Planungssicherheit ohne punktuelle Einzelprüfungsbelastung</text>
    <text x="16" y="140" fill="#334155" font-size="11">• Kontinuierliche Einbindung in den Stationsalltag des Betriebs</text>
    <text x="16" y="176" fill="#334155" font-size="11">• Sehr hohe Bestehensquote durch begleitende Praxisreflexion</text>
  </g>

  <rect x="44" y="456" width="632" height="42" rx="8" fill="#003366"/>
  <text x="360" y="482" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Voraussetzung für die Urkundenerteilung: Bestandene Ausgleichsmaßnahme + Fachsprache Deutsch B2 Pflege</text>
</svg>
