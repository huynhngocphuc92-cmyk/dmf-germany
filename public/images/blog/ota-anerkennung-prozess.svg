<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="otaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="800" height="420" fill="#f8fafc" rx="16" />

  <!-- Header -->
  <rect x="30" y="24" width="740" height="54" rx="10" fill="url(#otaGrad)" />
  <text x="50" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Anerkennungsweg für Operationstechnische Assistenten (OTA)</text>

  <!-- Step 1: Bachelornachweis in Vietnam -->
  <g transform="translate(30, 96)">
    <rect width="170" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="170" height="8" rx="4" fill="#64748b" />
    <circle cx="32" cy="38" r="16" fill="#f1f5f9" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">1</text>
    <text x="56" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e3a5f">Ausbildung VN</text>
    
    <text x="16" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">FUNDAMENT</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• 4-jähriges Studium</text>
    <text x="16" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  Pflegewissenschaft</text>
    <text x="16" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Chirurgischer Fokus</text>
    <text x="16" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• OP-Saal-Praxis an</text>
    <text x="16" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  Universitätskliniken</text>
    <text x="16" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• B1/B2 Sprachniveau</text>
    
    <rect x="14" y="230" width="142" height="34" rx="6" fill="#f1f5f9" />
    <text x="85" y="251" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Bachelor Nursing</text>
  </g>

  <!-- Step 2: Defizitbescheid -->
  <g transform="translate(220, 96)">
    <rect width="170" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="170" height="8" rx="4" fill="#0891b2" />
    <circle cx="32" cy="38" r="16" fill="#e0f2fe" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">2</text>
    <text x="56" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e3a5f">Gleichwertigkeit</text>
    
    <text x="16" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0891b2">BEHÖRDENPRÜFUNG</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Prüfung nach ATA-OTA-G</text>
    <text x="16" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Landesprüfungsamt</text>
    <text x="16" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Feststellung von</text>
    <text x="16" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  wesentlichen</text>
    <text x="16" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  Unterschieden</text>
    <text x="16" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Visum nach § 16d</text>
    
    <rect x="14" y="230" width="142" height="34" rx="6" fill="#e0f2fe" />
    <text x="85" y="251" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0369a1" text-anchor="middle">Defizitbescheid</text>
  </g>

  <!-- Step 3: Anpassungsmaßnahme im OP -->
  <g transform="translate(410, 96)">
    <rect width="170" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="170" height="8" rx="4" fill="#1e3a5f" />
    <circle cx="32" cy="38" r="16" fill="#f1f5f9" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e3a5f" text-anchor="middle">3</text>
    <text x="56" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e3a5f">Praxis &amp; Kurs</text>
    
    <text x="16" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1e3a5f">OP-EINWEISUNG</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Einsatz im OP-Saal</text>
    <text x="16" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Instrumentieren unter</text>
    <text x="16" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  fachlicher Aufsicht</text>
    <text x="16" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Springer-Tätigkeiten</text>
    <text x="16" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Sterilgutversorgung</text>
    <text x="16" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Fachsprache OP</text>
    
    <rect x="14" y="230" width="142" height="34" rx="6" fill="#f1f5f9" />
    <text x="85" y="251" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">6–12 Monate Klinik</text>
  </g>

  <!-- Step 4: Kenntnisprüfung & Volle Anerkennung -->
  <g transform="translate(600, 96)">
    <rect width="170" height="280" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="170" height="8" rx="4" fill="#059669" />
    <circle cx="32" cy="38" r="16" fill="#d1fae5" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">4</text>
    <text x="56" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#059669">Urkunde OTA</text>
    
    <text x="16" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#059669">BERUFSERLAUBNIS</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Abschlussprüfung</text>
    <text x="16" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  oder Anpassungsbericht</text>
    <text x="16" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Staatliche Urkunde</text>
    <text x="16" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Volle Tarifvergütung</text>
    <text x="16" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  TVöD-K / AVR</text>
    <text x="16" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Visum nach § 18a/b</text>
    
    <rect x="14" y="230" width="142" height="34" rx="6" fill="#d1fae5" />
    <text x="85" y="251" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">Volle Fachkraft</text>
  </g>
</svg>
