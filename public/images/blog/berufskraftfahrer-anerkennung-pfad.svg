<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="lkwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="800" height="420" fill="#f8fafc" rx="16" />

  <!-- Header -->
  <rect x="30" y="24" width="740" height="54" rx="10" fill="url(#lkwGrad)" />
  <text x="50" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Qualifizierungspfad: Berufskraftfahrer nach § 24a BeschV (Lkw C/CE)</text>

  <!-- Step 1: Heimatqualifikation VN -->
  <g transform="translate(30, 96)">
    <rect width="170" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="170" height="8" rx="4" fill="#64748b" />
    <circle cx="32" cy="38" r="16" fill="#f1f5f9" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">1</text>
    <text x="56" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e3a5f">Führerschein VN</text>
    
    <text x="16" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">BASIS IN VIETNAM</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Lkw-Klasse C / FC</text>
    <text x="16" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  (Schwere Nutzfahrzeuge)</text>
    <text x="16" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Mehrjährige Fahrpraxis</text>
    <text x="16" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  im Güterverkehr</text>
    <text x="16" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Deutschkurs B1</text>
    <text x="16" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Ärztliches Gutachten</text>
    
    <rect x="14" y="230" width="142" height="34" rx="6" fill="#f1f5f9" />
    <text x="85" y="251" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Ausgangsniveau</text>
  </g>

  <!-- Step 2: Umschreibung & Theorie -->
  <g transform="translate(220, 96)">
    <rect width="170" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="170" height="8" rx="4" fill="#0891b2" />
    <circle cx="32" cy="38" r="16" fill="#e0f2fe" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">2</text>
    <text x="56" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e3a5f">Fahrschule DE</text>
    
    <text x="16" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0891b2">UMSCHREIBUNG</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Umschreibung nach</text>
    <text x="16" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  Anlage 11 FeV</text>
    <text x="16" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Theoretische Prüfung</text>
    <text x="16" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  beim TÜV / DEKRA</text>
    <text x="16" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Praktische Fahrprüfung</text>
    <text x="16" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Visum nach § 24a</text>
    
    <rect x="14" y="230" width="142" height="34" rx="6" fill="#e0f2fe" />
    <text x="85" y="251" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0369a1" text-anchor="middle">EU-Führerschein C/CE</text>
  </g>

  <!-- Step 3: Grundqualifikation (BKrFQG) -->
  <g transform="translate(410, 96)">
    <rect width="170" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="170" height="8" rx="4" fill="#1e3a5f" />
    <circle cx="32" cy="38" r="16" fill="#f1f5f9" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e3a5f" text-anchor="middle">3</text>
    <text x="56" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e3a5f">IHK-Prüfung</text>
    
    <text x="16" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1e3a5f">SCHLÜSSELZAHL 95</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Beschleunigte</text>
    <text x="16" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  Grundqualifikation</text>
    <text x="16" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• 140 Stunden Unterricht</text>
    <text x="16" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• IHK-Theorieprüfung</text>
    <text x="16" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Ladungssicherung &amp;</text>
    <text x="16" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  Lenk-/Ruhezeiten</text>
    
    <rect x="14" y="230" width="142" height="34" rx="6" fill="#f1f5f9" />
    <text x="85" y="251" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">FQN-Fahrerkarte</text>
  </g>

  <!-- Step 4: Vollwertiger Lkw-Einsatz -->
  <g transform="translate(600, 96)">
    <rect width="170" height="280" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="170" height="8" rx="4" fill="#059669" />
    <circle cx="32" cy="38" r="16" fill="#d1fae5" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">🚚</text>
    <text x="56" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#059669">Fahrereinsatz</text>
    
    <text x="16" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#059669">VOLLER FAHRDIENST</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Nah- &amp; Fernverkehr</text>
    <text x="16" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Digitaler Fahrtenschreiber</text>
    <text x="16" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Voller Tariflohn</text>
    <text x="16" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  Spedition &amp; Logistik</text>
    <text x="16" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Unbefristete Verlängerung</text>
    <text x="20" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Speditionsintegration</text>
    
    <rect x="14" y="230" width="142" height="34" rx="6" fill="#d1fae5" />
    <text x="85" y="251" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">Zuverlässig auf Achse</text>
  </g>
</svg>
