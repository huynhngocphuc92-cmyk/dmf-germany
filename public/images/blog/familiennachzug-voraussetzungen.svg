<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="famGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="800" height="420" fill="#f8fafc" rx="16" />

  <!-- Header -->
  <rect x="30" y="24" width="740" height="54" rx="10" fill="url(#famGrad)" />
  <text x="50" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Voraussetzungen für den Familiennachzug nach §§ 29–32 AufenthG</text>

  <!-- Box 1: Aufenthaltstitel -->
  <g transform="translate(30, 96)">
    <rect width="170" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="170" height="8" rx="4" fill="#0891b2" />
    <circle cx="32" cy="38" r="16" fill="#e0f2fe" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">1</text>
    <text x="56" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e3a5f">Aufenthaltstitel</text>
    
    <text x="16" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0891b2">STATUS IN DE</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Fachkrafttitel</text>
    <text x="16" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  (§ 18a / § 18b)</text>
    <text x="16" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Blaue Karte EU</text>
    <text x="16" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  (§ 18g - erleichtert)</text>
    <text x="16" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Niederlassung (§ 18c)</text>
    <text x="16" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Gültiger Pass</text>
    
    <rect x="14" y="230" width="142" height="34" rx="6" fill="#e0f2fe" />
    <text x="85" y="251" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0369a1" text-anchor="middle">Rechtliche Basis</text>
  </g>

  <!-- Box 2: Lebensunterhalt -->
  <g transform="translate(220, 96)">
    <rect width="170" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="170" height="8" rx="4" fill="#1e3a5f" />
    <circle cx="32" cy="38" r="16" fill="#f1f5f9" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e3a5f" text-anchor="middle">2</text>
    <text x="56" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e3a5f">Finanzen</text>
    
    <text x="16" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1e3a5f">LEBENSUNTERHALT</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Kein Anspruch auf</text>
    <text x="16" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  Bürgergeld / SGB II</text>
    <text x="16" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Ausreichendes Netto-</text>
    <text x="16" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  einkommen der Familie</text>
    <text x="16" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Gehaltsabrechnungen</text>
    <text x="16" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Arbeitsvertrag ungekündigt</text>
    
    <rect x="14" y="230" width="142" height="34" rx="6" fill="#f1f5f9" />
    <text x="85" y="251" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">Sicherer Verdienst</text>
  </g>

  <!-- Box 3: Wohnraum -->
  <g transform="translate(410, 96)">
    <rect width="170" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="170" height="8" rx="4" fill="#0891b2" />
    <circle cx="32" cy="38" r="16" fill="#e0f2fe" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0891b2" text-anchor="middle">3</text>
    <text x="56" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e3a5f">Wohnraum</text>
    
    <text x="16" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0891b2">QUADRATMETERVORGABE</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Mind. 12 m² pro Person</text>
    <text x="16" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  (ab 6 Jahren)</text>
    <text x="16" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Mind. 10 m² für Kinder</text>
    <text x="16" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  unter 6 Jahren</text>
    <text x="16" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Mietvertrag &amp; Vermieter-</text>
    <text x="16" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  bescheinigung (§ 2 Abs. 4)</text>
    
    <rect x="14" y="230" width="142" height="34" rx="6" fill="#f1f5f9" />
    <text x="85" y="251" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">Mietnachweis</text>
  </g>

  <!-- Box 4: Sprache & Krankenversicherung -->
  <g transform="translate(600, 96)">
    <rect width="170" height="280" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="170" height="8" rx="4" fill="#059669" />
    <circle cx="32" cy="38" r="16" fill="#d1fae5" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">4</text>
    <text x="56" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#059669">Sprache &amp; KV</text>
    
    <text x="16" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#059669">INTEGRATION</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Deutsch A1 Ehepartner</text>
    <text x="16" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  (Entfällt bei Blauer Karte)</text>
    <text x="16" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Familienversicherung</text>
    <text x="16" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">  gesetzliche Krankenkasse</text>
    <text x="16" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Schulpflicht der Kinder</text>
    <text x="16" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Erwerbstätigkeit Ehepartner</text>
    
    <rect x="14" y="230" width="142" height="34" rx="6" fill="#d1fae5" />
    <text x="85" y="251" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">Arbeitserlaubnis inkl.</text>
  </g>
</svg>
