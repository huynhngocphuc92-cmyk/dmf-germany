<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="kfzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#f8fafc" rx="16" />

  <!-- Header -->
  <rect x="30" y="24" width="740" height="54" rx="10" fill="url(#kfzGrad)" />
  <text x="50" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Hochvolt-Qualifikationsstufen nach DGUV 209-093 (E-Mobilität)</text>

  <!-- Level 1S: EuP -->
  <g transform="translate(30, 96)">
    <rect width="230" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="230" height="8" rx="4" fill="#64748b" />
    <circle cx="36" cy="40" r="18" fill="#f1f5f9" />
    <text x="36" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">1S</text>
    <text x="66" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e3a5f">Stufe 1S: EuP</text>
    
    <text x="20" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">UNTERWIESENE PERSON</text>
    <text x="20" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">• Nicht-elektrotechnische Arbeiten</text>
    <text x="20" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">• Reifen- &amp; Bremsenwechsel</text>
    <text x="20" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">• Karosserie- &amp; Scheibenservice</text>
    <text x="20" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">• Gefahrensensibilisierung HV</text>
    <text x="20" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">• Sichtprüfung HV-Komponenten</text>
    
    <rect x="18" y="224" width="194" height="38" rx="6" fill="#f1f5f9" />
    <text x="115" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Basisschulung (ca. 4–8 Std.)</text>
  </g>

  <!-- Level 2S: Fachkundige Person (FHV) -->
  <g transform="translate(285, 96)">
    <rect width="230" height="280" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="230" height="8" rx="4" fill="#0891b2" />
    <circle cx="36" cy="40" r="18" fill="#e0f2fe" />
    <text x="36" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">2S</text>
    <text x="66" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e3a5f">Stufe 2S: FHV</text>
    
    <text x="20" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0891b2">FACHKUNDIGER (KERNPROFIL)</text>
    <text x="20" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">• Spannungsfreischaltung HV</text>
    <text x="20" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">• Gegen Wiedereinschalten sichern</text>
    <text x="20" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">• Spannungsfreiheit feststellen</text>
    <text x="20" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">• Tausch von HV-Leitungen/Invertern</text>
    <text x="20" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">• Isolations- &amp; Potenzialprüfung</text>
    
    <rect x="18" y="224" width="194" height="38" rx="6" fill="#e0f2fe" />
    <text x="115" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0369a1" text-anchor="middle">DMF-Fokus: Kfz-Mechatroniker</text>
  </g>

  <!-- Level 3S: Arbeiten unter Spannung -->
  <g transform="translate(540, 96)">
    <rect width="230" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="230" height="8" rx="4" fill="#1e3a5f" />
    <circle cx="36" cy="40" r="18" fill="#e0f2fe" />
    <text x="36" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e3a5f" text-anchor="middle">3S</text>
    <text x="66" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e3a5f">Stufe 3S: AuS</text>
    
    <text x="20" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1e3a5f">ARBEITEN UNTER SPANNUNG</text>
    <text x="20" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">• Instandsetzung offener Batterien</text>
    <text x="20" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">• Zellmodultausch unter Spannung</text>
    <text x="20" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">• Spezielle Isolierausrüstung &amp; PSA</text>
    <text x="20" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">• Notfallmanagement &amp; Brandfall</text>
    <text x="20" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">• Labor- &amp; Entwicklungsbereich</text>
    
    <rect x="18" y="224" width="194" height="38" rx="6" fill="#f1f5f9" />
    <text x="115" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1e3a5f" text-anchor="middle">Spezialausbildung Kfz-Betrieb</text>
  </g>
</svg>
